# A cada push em feature/*: valida a branch, abre o PR para develop (se não existir) e roda o Danger.
# PRs criados pelo GITHUB_TOKEN não disparam outros workflows, por isso o Danger roda aqui.
name: Auto PR

on:
  push:
    branches: ['feature/**']

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write
  packages: read

concurrency:
  group: auto-pr-${{ github.ref }}

env:
  BASE_BRANCH: develop

jobs:
  pull-request:
    name: Abrir PR
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.pr.outputs.number }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@elizfab'
      - name: Criar ou localizar PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          rules() { npx --yes --package @elizfab/danger-rules elizfab-rules "$@"; }
          rules branch "$BRANCH"
          number=$(gh pr list --head "$BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            if [ "$(git rev-list --count "origin/$BASE_BRANCH..HEAD")" = "0" ]; then
              echo "Branch sem commits novos em relação a $BASE_BRANCH."; exit 0
            fi
            {
              echo "## Resumo"; echo; echo "<!-- TODO: descreva o que muda e por quê -->"; echo
              echo "## Commits"; echo; git log --reverse --format='- %s' "origin/$BASE_BRANCH..HEAD"; echo
              sed -n '/^## Checklist/,$p' .github/pull_request_template.md
            } > pr-body.md
            url=$(gh pr create --base "$BASE_BRANCH" --head "$BRANCH" --title "$(rules title-from-branch "$BRANCH")" \
              --body-file pr-body.md --assignee "$GITHUB_ACTOR")
            number=${url##*/}
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

  danger:
    name: Danger
    needs: pull-request
    if: needs.pull-request.outputs.number != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Danger
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.pull-request.outputs.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > pr.json
          jq '{action: "synchronize", number: .number, pull_request: ., repository: .base.repo}' pr.json > "$RUNNER_TEMP/pr-event.json"
          GITHUB_EVENT_PATH="$RUNNER_TEMP/pr-event.json" npx danger ci --failOnErrors
